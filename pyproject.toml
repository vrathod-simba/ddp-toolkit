[project]
name            = "ddp-toolkit"
version         = "0.1.0"
description     = "Add your description here"
readme          = "README.md"
requires-python = ">=3.9"
license         = "MIT"
license-files   = [ "LICENSE" ]
keywords        = [ "python", "ddp", "touchstone", "perftest" ]
classifiers     = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies    = []

[[project.authors]]
name            = "Vipul Rathod"
email           = "vipul.rathod@insightsoftware.com"

# [project.scripts]
# <package> = "<package>.main:main"

[project.urls]
Homepage        = "https://github.com/vrathod-simba/ddp-toolkit"
Repository      = "https://github.com/vrathod-simba/ddp-toolkit"
Issues          = "https://github.com/vrathod-simba/ddp-toolkit/issues"
Documentation   = "https://github.com/vrathod-simba/ddp-toolkit#readme"
Changelog       = "https://github.com/vrathod-simba/ddp-toolkit/releases"

# Note: is inherited by all the workspace members and open to override in the individual members.
[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.uv]
required-version    = ">=0.5"
default-groups      = [ "dev" ]
package             = false

[tool.uv.workspace]
members = [
    "src/packages/*",
]
exclude = []