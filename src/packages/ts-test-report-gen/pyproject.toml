[project]
name            = "ts-test-report-gen"
version         = "0.1.0"
description     = "Add your description here"
readme          = "README.md"
requires-python = ">=3.12"
keywords        = [ "python", "ddp", "touchstone", "report" ]
classifiers     = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies    = []

[[project.authors]]
name            = "Vipul Rathod"
email           = "vipul.rathod@insightsoftware.com"

[project.scripts]
ts-test-report-gen = "ts_test_report_gen.main:main"

[project.urls]
Homepage        = "https://github.com/vrathod-simba/ddp-toolkit"
Repository      = "https://github.com/vrathod-simba/ddp-toolkit"
Issues          = "https://github.com/vrathod-simba/ddp-toolkit/issues"
Documentation   = "https://github.com/vrathod-simba/ddp-toolkit#readme"
Changelog       = "https://github.com/vrathod-simba/ddp-toolkit/releases"

[tool.uv]
required-version    = ">=0.5"
default-groups      = []
package             = true

# [tool.uv.sources]
# Pin git or path dependencies here, e.g.
# my-lib = { git = "https://github.com/org/my-lib", tag = "v1.2.3" }

[tool.hatch.build.targets.wheel]
packages        = [ "src/ts_test_report_gen" ]

[build-system]
requires        = [ "hatchling" ]
build-backend   = "hatchling.build"
