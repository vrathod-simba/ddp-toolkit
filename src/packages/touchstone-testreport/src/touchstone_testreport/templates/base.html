<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Touchstone Test Report{% endblock %}</title>

    <!-- Bootstrap 5.3.3 CSS (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons 1.11.3 (CDN) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Devicon (CDN) - used only for the Jenkins pipeline mark -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/devicon@2.16.0/devicon.min.css">

    <style>
        /* ---------- Dark Mode (default): pitch-black canvas + frosted glass surfaces ---------- */
        :root {
            --ts-bg-canvas: #000000;
            --ts-glass-bg: rgba(255, 255, 255, 0.045);
            --ts-glass-bg-strong: rgba(255, 255, 255, 0.08);
            --ts-glass-border: rgba(255, 255, 255, 0.10);
            --ts-glass-border-strong: rgba(255, 255, 255, 0.18);
            --ts-glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.55);
            --ts-blur: blur(20px) saturate(180%);
            --ts-text-primary: #f5f5f7;
            --ts-text-muted: #9a9aa2;

            /* Single-hue navy accent family: one color, varied by intensity (lightness) only */
            --ts-accent-deep: hsl(222, 68%, 25%);
            --ts-accent: hsl(222, 68%, 55%);
            --ts-accent-tint: hsl(222, 68%, 70%);
            --ts-gradient-navy: linear-gradient(135deg, var(--ts-accent-deep) 0%, var(--ts-accent) 100%);
            --ts-glow-a: hsla(222, 68%, 45%, 0.20);
            --ts-glow-b: hsla(222, 68%, 62%, 0.12);

            --ts-success: #34d399;
            --ts-danger: #f87171;
            --ts-warning: #fbbf24;

            /* Test-result chart family: blue/indigo/cyan/slate only - stays in the page's own color family */
            --ts-result-succeed: hsl(217, 91%, 63%);
            --ts-result-failed: hsl(238, 62%, 58%);
            --ts-result-excluded: hsl(196, 82%, 58%);
            --ts-result-other: hsl(220, 14%, 55%);

            --ts-font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --ts-font-mono: Consolas, "SFMono-Regular", "Courier New", monospace;
        }

        html,
        body {
            height: 100%;
        }

        body {
            background-color: var(--ts-bg-canvas);
            color: var(--ts-text-primary);
            font-family: var(--ts-font-sans);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            position: relative;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        /* Soft ambient color blobs behind the glass panes */
        body::before,
        body::after {
            content: "";
            position: fixed;
            width: 40rem;
            height: 40rem;
            border-radius: 50%;
            filter: blur(110px);
            z-index: 0;
            pointer-events: none;
        }

        body::before {
            top: -12rem;
            left: -10rem;
            background: var(--ts-glow-a);
        }

        body::after {
            bottom: -14rem;
            right: -10rem;
            background: var(--ts-glow-b);
        }

        header,
        main,
        footer {
            position: relative;
            z-index: 1;
        }

        /* ---------- Gradient Text Utility (single navy hue, 25% -> 55% intensity) ---------- */
        .ts-gradient-text {
            background: var(--ts-gradient-navy);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            filter: drop-shadow(0 0 16px hsla(222, 68%, 45%, 0.28));
        }

        /* ---------- Glass Surface Base ---------- */
        .ts-glass {
            background: var(--ts-glass-bg);
            border: 1px solid var(--ts-glass-border);
            -webkit-backdrop-filter: var(--ts-blur);
            backdrop-filter: var(--ts-blur);
            box-shadow: var(--ts-glass-shadow);
        }

        /* ---------- Header ---------- */
        .ts-header {
            background: var(--ts-glass-bg);
            border-bottom: 1px solid var(--ts-glass-border);
            -webkit-backdrop-filter: var(--ts-blur);
            backdrop-filter: var(--ts-blur);
        }

        .ts-brand-mark {
            width: 3rem;
            height: 3rem;
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.85rem;
            background: #000000;
            border: 1px solid var(--ts-glass-border-strong);
            font-size: 1.5rem;
            box-shadow: 0 6px 20px hsla(222, 68%, 30%, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        .ts-brand-mark i {
            background: var(--ts-gradient-navy);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }

        .ts-brand-title {
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.1;
            margin: 0;
        }

        .ts-brand-subtitle {
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.32em;
            text-transform: uppercase;
            margin: 0.3rem 0 0;
        }

        .ts-type-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            background: hsla(222, 68%, 55%, 0.14);
            border: 1px solid hsla(222, 68%, 55%, 0.32);
            color: var(--ts-accent-tint);
            padding: 0.15rem 0.6rem;
            border-radius: 0.4rem;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            text-decoration: none;
            width: fit-content;
        }

        .ts-type-badge:hover {
            border-color: var(--ts-accent);
            color: var(--ts-accent-tint);
        }

        .ts-meta-line {
            font-size: 0.8rem;
            color: var(--ts-text-muted);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.35rem 1rem;
            margin-top: 0.5rem;
            font-family: var(--ts-font-mono);
        }

        .ts-meta-line .ts-meta-sep {
            color: var(--ts-glass-border-strong);
            font-family: var(--ts-font-sans);
        }

        .ts-header-controls {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .ts-icon-btn {
            background: var(--ts-glass-bg-strong);
            border: 1px solid var(--ts-glass-border);
            color: var(--ts-text-primary);
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 0.65rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
        }

        .ts-icon-btn:hover {
            background-color: var(--ts-glow-a);
            border-color: var(--ts-accent);
            color: var(--ts-text-primary);
            transform: translateY(-1px);
        }

        .ts-pipeline-link {
            background: var(--ts-glass-bg-strong);
            border: 1px solid var(--ts-glass-border);
            color: var(--ts-text-primary);
            padding: 0.4rem 0.85rem;
            border-radius: 0.65rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
        }

        .ts-pipeline-link:hover {
            background-color: var(--ts-glow-b);
            border-color: var(--ts-accent-tint);
            color: var(--ts-text-primary);
            transform: translateY(-1px);
        }

        /* ---------- Component Surfaces (cards, tables, etc.) ---------- */
        .ts-surface {
            background: var(--ts-glass-bg);
            border: 1px solid var(--ts-glass-border);
            border-radius: 0.9rem;
            -webkit-backdrop-filter: var(--ts-blur);
            backdrop-filter: var(--ts-blur);
            box-shadow: var(--ts-glass-shadow);
        }

        /* ---------- Reusable Link Styles (Bootstrap-based, shared across pages) ---------- */
        .ts-link {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            color: var(--ts-accent-tint);
            font-weight: 600;
            font-size: 0.88rem;
            text-decoration: none;
        }

        .ts-link:hover {
            color: var(--ts-accent);
            text-decoration: underline;
        }

        .ts-link i {
            transition: transform 0.15s ease;
        }

        .ts-link:hover i.bi-arrow-right {
            transform: translateX(3px);
        }

        .ts-list-group {
            border-radius: 0.65rem;
            overflow: hidden;
        }

        .ts-list-group .list-group-item {
            background: var(--ts-glass-bg);
            border-color: var(--ts-glass-border);
            color: var(--ts-text-primary);
            padding: 0.65rem 0.9rem;
            transition: background-color 0.15s ease, border-color 0.15s ease;
        }

        .ts-list-group .list-group-item-action:hover,
        .ts-list-group .list-group-item-action:focus {
            background: var(--ts-glow-a);
            color: var(--ts-text-primary);
            z-index: 1;
        }

        /* ---------- Footer ---------- */
        .ts-footer {
            background: var(--ts-glass-bg);
            border-top: 1px solid var(--ts-glass-border);
            color: var(--ts-text-muted);
            font-size: 0.8rem;
            margin-top: auto;
            -webkit-backdrop-filter: var(--ts-blur);
            backdrop-filter: var(--ts-blur);
        }

        .ts-footer a {
            color: var(--ts-text-muted);
            text-decoration: none;
            margin-left: 1.25rem;
        }

        .ts-footer a:hover {
            color: var(--ts-accent-tint);
        }

        main {
            flex: 1 0 auto;
        }

        /* ---------- Breadcrumb Nav ---------- */
        .ts-breadcrumb-bar {
            background: var(--ts-glass-bg);
            border-bottom: 1px solid var(--ts-glass-border);
            padding: 0.55rem 0;
            -webkit-backdrop-filter: var(--ts-blur);
            backdrop-filter: var(--ts-blur);
        }

        .ts-breadcrumb {
            --bs-breadcrumb-divider: ">";
            font-size: 0.8rem;
        }

        .ts-breadcrumb .breadcrumb-item a {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            color: var(--ts-text-muted);
            text-decoration: none;
            transition: color 0.15s ease;
        }

        .ts-breadcrumb .breadcrumb-item a:hover {
            color: var(--ts-accent-tint);
        }

        .ts-breadcrumb .breadcrumb-item.active {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            color: var(--ts-text-primary);
            font-weight: 600;
        }

        .ts-breadcrumb .breadcrumb-item+.breadcrumb-item::before {
            color: var(--ts-glass-border-strong);
        }

        /* ---------- Light Mode Override: crisp white canvas + frosted glass ---------- */
        body.light-mode-active {
            --ts-bg-canvas: #ffffff;
            --ts-glass-bg: rgba(255, 255, 255, 0.55);
            --ts-glass-bg-strong: rgba(255, 255, 255, 0.75);
            --ts-glass-border: rgba(15, 23, 42, 0.08);
            --ts-glass-border-strong: rgba(15, 23, 42, 0.14);
            --ts-glass-shadow: 0 8px 28px rgba(15, 23, 42, 0.08);
            --ts-text-primary: #0f172a;
            --ts-text-muted: #5b6472;
            --ts-accent-tint: hsl(222, 68%, 42%);
            --ts-success: #059669;
            --ts-danger: #dc2626;
            --ts-warning: #d97706;
            --ts-glow-a: hsla(222, 68%, 45%, 0.10);
            --ts-glow-b: hsla(222, 68%, 40%, 0.08);

            --ts-result-succeed: hsl(217, 85%, 50%);
            --ts-result-failed: hsl(238, 55%, 46%);
            --ts-result-excluded: hsl(196, 78%, 40%);
            --ts-result-other: hsl(220, 12%, 42%);
        }

        body.light-mode-active .ts-icon-btn,
        body.light-mode-active .ts-pipeline-link {
            color: var(--ts-text-primary);
        }
        
        {% block extra_styles %}{% endblock %}
    </style>
</head>

<body>

    <!-- ============ HEADER ============ -->
    <header class="ts-header py-3">
        <div class="container-fluid">
            <div class="d-flex flex-wrap justify-content-between align-items-start gap-3">

                <!-- Left: Brand Stack -->
                <div class="ts-brand-stack d-flex align-items-start gap-3">
                    <div class="ts-brand-mark" aria-hidden="true">
                        <i class="bi bi-gem"></i>
                    </div>
                    <div>
                        <h1 class="ts-brand-title ts-gradient-text">Touchstone</h1>
                        <p class="ts-brand-subtitle ts-gradient-text">Test Report</p>
                        <div class="ts-meta-line">
                            <span><i class="bi bi-calendar-event"></i> {{ exec_time }}</span>
                            <span class="ts-meta-sep">|</span>
                            <span><i class="bi bi-cpu"></i> v{{ ts_ver }}</span>
                        </div>
                    </div>
                </div>

                <!-- Right: Operational Controls -->
                <div class="ts-header-controls">
                    <a href="{{ pipeline_url }}" target="_blank" rel="noopener noreferrer" class="ts-pipeline-link"
                        title="Open Jenkins Pipeline">
                        <i class="devicon-jenkins-plain"></i>
                        <span>Pipeline</span>
                        <i class="bi bi-box-arrow-up-right"></i>
                    </a>

                    <button type="button" class="ts-icon-btn" id="themeToggleBtn" title="Toggle light / dark mode"
                        aria-label="Toggle theme">
                        <i class="bi bi-sun-fill" id="themeToggleIcon"></i>
                    </button>
                </div>

            </div>
        </div>
    </header>

    <!-- ============ BREADCRUMB NAV ============ -->
    <nav aria-label="breadcrumb" class="ts-breadcrumb-bar">
        <div class="container-fluid">
            <ol class="breadcrumb ts-breadcrumb mb-0">
                {% block breadcrumb %}
                <li class="breadcrumb-item active" aria-current="page"><i class="bi bi-house-door-fill"></i> Home</li>
                {% endblock %}
            </ol>
        </div>
    </nav>

    <!-- ============ MAIN CONTENT ============ -->
    <main class="container-fluid my-4">
        {% block content %}{% endblock %}
    </main>

    <!-- ============ FOOTER ============ -->
    <footer class="ts-footer py-3">
        <div class="container-fluid d-flex flex-wrap justify-content-between align-items-center gap-2">
            <div>
                &copy; 2026 DDP Toolkit - Touchstone Test Report
            </div>
            <div>
                <a href="https://github.com/vrathod-simba/ddp-toolkit" title="Local Documentation">
                    <i class="bi bi-github"></i> GitHub
                </a>
                <!-- <a href="#" id="debugLogToggle" title="Toggle Debug Log Overview">
                    <i class="bi bi-terminal"></i> Debug Log
                </a> -->
            </div>
        </div>
    </footer>

    <!-- Bootstrap 5.3.3 Bundle JS (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // ---------- Theme Toggle (persists offline via localStorage) ----------
        (function () {
            const THEME_KEY = 'touchstone-theme';
            const toggleBtn = document.getElementById('themeToggleBtn');
            const toggleIcon = document.getElementById('themeToggleIcon');

            function applyTheme(isLight) {
                document.body.classList.toggle('light-mode-active', isLight);
                toggleIcon.classList.toggle('bi-sun-fill', !isLight);
                toggleIcon.classList.toggle('bi-moon-stars-fill', isLight);
            }

            let savedTheme = null;
            try {
                savedTheme = localStorage.getItem(THEME_KEY);
            } catch (error) {
                // localStorage unavailable (e.g. file:// restrictions) - fall back to dark mode.
            }
            applyTheme(savedTheme === 'light');

            toggleBtn.addEventListener('click', function () {
                const isLight = !document.body.classList.contains('light-mode-active');
                applyTheme(isLight);
                try {
                    localStorage.setItem(THEME_KEY, isLight ? 'light' : 'dark');
                } catch (error) {
                    // Ignore - theme just won't persist across reloads.
                }
            });
        })();
    </script>

    {% block extra_scripts %}{% endblock %}
</body>

</html>
